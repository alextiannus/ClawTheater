services:
  - type: web
    name: claw-theater-frontend
    env: node
    plan: starter # or standard for production
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: claw-db
          property: connectionString
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: NEXT_PUBLIC_SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_ADMIN_EMAILS
        sync: false
      - key: ADMIN_API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false

databases:
  - name: claw-db
    plan: starter # change to standard for production
    databaseName: clawtheater
    user: admin
